<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        nav{
            display: inline-block;
            background-color: black;
            color: white;
            width: 100%;
            height: 60px;
        }
        nav h1,nav ul,nav li{
            display: inline;
        }
        nav ul{
            padding-left: 70%;
        }
        nav li{
            padding-left: 10px;
        }
        nav h1{
            padding-left: 60px;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>Heading</h1>
        <ul>
            <li>option 1</li>
            <li>option 2</li>
            <li>option 3</li>
            <li>option 4</li>
        </ul>
    </nav>
</body>
</html>
