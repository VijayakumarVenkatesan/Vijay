<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Transaction</title>
</head>
<body>
    <h1>Upload Transaction Data</h1>
    <form action="/upload" method="POST">
        <label for="transaction_data">Transaction Data:</label>
        <input type="text" id="transaction_data" name="transaction_data" required>
        <button type="submit">Submit</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
