<!DOCTYPE html>
<html>
<head>
    <title>Visualize Smurfing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0fff0;
        }

        .navbar-custom {
            background-color: #000;
            width: 100%;
        }

        .navbar-custom .nav-link,
        .navbar-custom .fs-4 {
            color: white;
        }

        .navbar-custom .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }

        .navbar-custom .nav-link:hover {
            color: #ddd;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        img {
            width: 80%;
            max-width: 800px;
            border: 2px solid #333;
            margin-top: 20px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Full-width Navbar without left/right padding -->
    <header class="navbar-custom d-flex flex-wrap justify-content-center py-3 border-bottom rounded">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none ps-3">
            <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                <use xlink:href="#bootstrap"></use>
            </svg>
            <span class="fs-4">Anti - Money Laundering System</span>
        </a>
        <ul class="nav nav-pills pe-3">
            <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="/upload" class="nav-link">Upload</a></li>
            <li class="nav-item"><a href="/fetch" class="nav-link">View</a></li>
            <li class="nav-item"><a href="/report" class="nav-link">Report</a></li>
            <li class="nav-item"><a href="/visualize" class="nav-link active" aria-current="page">Visualize</a></li>
            <li class="nav-item"><a href="/dashboard" class="nav-link">Dashboard</a></li>
        </ul>
    </header>

    <div class="content">
        <h1>Smurfing Graph from {{ filename }}</h1>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        {% if graph_path %}
            <img src="{{ graph_path }}" alt="Smurfing Graph">
        {% endif %}
    </div>

    <!-- Common Footer Start -->
    <footer style="background-color:#222; color:#ddd; padding:20px 10px; text-align:center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size:14px;">
      <div style="max-width:1200px; margin:0 auto;">
        <p style="margin:0 0 10px;"> 2024 Anti Money Laundering System.</p>
        <div style="margin-bottom:10px;">
          <a href="/" style="color:#ddd; margin: 0 10px; text-decoration:none;">Home</a> |
          <a href="/upload" style="color:#ddd; margin: 0 10px; text-decoration:none;">Upload</a> |
          <a href="/fetch" style="color:#ddd; margin: 0 10px; text-decoration:none;">View</a> |
          <a href="/report" style="color:#ddd; margin: 0 10px; text-decoration:none;">Report</a> |
          <a href="/visualize" style="color:#ddd; margin: 0 10px; text-decoration:none;">Visualize</a> |
          <a href="/dashboard" style="color:#ddd; margin: 0 10px; text-decoration:none;">Dashboard</a>
        </div>
      </div>
    </footer>
    <!-- Common Footer End -->

</body>
</html>
