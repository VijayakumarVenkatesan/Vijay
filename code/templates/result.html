<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* General styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background-color: #f5c842;
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        /* Content section */
        .content {
            width: 60%;
            margin: 0 auto;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .content p {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .content a {
            display: inline-block;
            background-color: #f5c842;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .content a:hover {
            background-color: #1abc9c;
        }

        /* Footer */
        footer {
            background-color: #34495e;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>ANTI-MONEY LAUNDERING USING CRYPTOGRAPHY</h1>
    </header>

    <div class="content">
        <p>{{ result }}</p>
        <a href="/">Back to Home</a>
    </div>

    <footer>
        <p>&copy; 2025 Anti-Money Laundering System. All Rights Reserved.</p>
    </footer>
</body>
</html>
