<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Performance</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 36px;
            margin-top: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #3498db;
            font-size: 28px;
            margin-top: 40px;
        }

        p, pre {
            font-size: 18px;
            margin: 10px 0;
            padding: 10px;
            background-color: #ffffff;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
            overflow-x: auto;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }

        img {
            display: block;
            margin: 30px auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        img:hover {
            transform: scale(1.05);
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .card {
            padding: 20px;
            margin-bottom: 30px;
            background-color: #ecf0f1;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 12px rgba(0, 0, 0, 0.2);
        }

        /* Button Style */
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
            display: inline-block;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* Responsive Styling */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .container {
                width: 100%;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 22px;
            }

            p, pre {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Model Performance</h1>

        <div class="card">
            <h2>Confusion Matrix</h2>
            <pre>{{ confusion_matrix }}</pre>
        </div>

        <div class="card">
            <h2>Accuracy Score</h2>
            <p>{{ accuracy }}</p>
        </div>

        <div class="card">
            <h2>Classification Report</h2>
            <pre>{{ classification_report }}</pre>
        </div>

        <div class="card">
            <h2>ROC Curve</h2>
            <img src="{{ url_for('static', filename='plots/roc_curve.png') }}" alt="ROC Curve">
        </div>
        <div class="card">
            <h2>Original Plot</h2>
            <img src="{{ url_for('static', filename='plots/original_plot.png') }}" alt="Original Plot">
        </div>
         <div class="card">
            <h2>Resampled Plot</h2>
            <img src="{{ url_for('static', filename='plots/resampled_plot.png') }}" alt="resampled_plot">
        </div>
<div class="card">
            <h2>Smote Plot</h2>
            <img src="{{ url_for('static', filename='plots/SMOTE_plot.png') }}" alt="SMOTE_plot">
        </div>
        <div style="text-align: center;">
            <a href="/" class="btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
