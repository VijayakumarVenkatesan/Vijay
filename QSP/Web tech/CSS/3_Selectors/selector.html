<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="selector.css">
    <title>CSS Selectors</title>
</head>
<body>
    <header>
        <h1>Selectors in CSS</h1>
        <h1>I am heading 1 tag</h1>
    </header>
    <main>
        <div class="selector">
            <h1>Universal selector</h1>
            <p>It selects all the elements in the HTML</p>
        </div>
        <div class="selector">
            <h1>Tag selector</h1>
            <p>It select elements by the tag name</p>
        </div>
        <div class="selector">
            <h1>Id selector</h1>
            <p>It selects the element by specified id name</p>
        </div>
        <div class="selector">
            <h1>Class selector</h1>
            <p>It selects the element by specified class name</p>
        </div>
    </main>
</body>
</html>
