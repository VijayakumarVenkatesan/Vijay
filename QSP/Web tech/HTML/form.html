<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        td{
            padding-right: 30px;
        }
        input, select{
            width: 250px;
            height: 30px;
            border-radius: 10px;
            border: none;
            border-color: antiquewhite;
        }
        textarea{
            border-radius: 10px;
            width: 250px;
            border: none;
            border-color: antiquewhite;
        }
        textarea:focus{
            background-color: rgb(238, 231, 221);
        }
        input:focus{
            background-color: rgb(238, 231, 221);
        }
        input::placeholder{
            padding-left: 20px ;
        }
        button{
            height: 30px;
            width: 100px;
            border-radius: 10px;
            background-color: black;
            color: white;
        }
        button:hover{
            background-color: white;
            color: black;
        }
        form{
            background-color: rgb(235, 230, 230);
            width: 60%;
            padding: 60px;
            border-radius: 20px;
            margin: auto;
            margin-bottom: 60px;
        }
        h1{
            display: block;
            text-align: center;
        }
        table{
            margin: auto;
            border-spacing: 10px;
        }
    </style>
</head>
<body>
    <h1>Forms</h1>
    <h1>Student form</h1>
    <form action="submit">
        <table>
            <tr>
                <td><label for="studentName">Student Name</label></td>
                <td><input type="text" name="studentName" id="studentName" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td><label for="phnNo">Phone number</label></td>
                <td><input type="number" name="phnNo" id="phnNo" placeholder="Enter your mobile number"></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="text" name="email" id="email" placeholder="Enter your email id"></td>
            </tr>
            <tr>
                <td><label for="gender">Gender</label></td>
                <td>
                    <select name="gender" id="gender">
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Others">Others</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="address">Address</label></td>
                <td><input type="text" name="address" id="address" placeholder="Enter your address"></td>
            </tr>
            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" name="city" id="city" placeholder="Enter your city"></td>
            </tr>
            <tr>
                <td><label for="district">District</label></td>
                <td><input type="text" name="district" id="district" placeholder="Enter your district"></td>
            </tr>
            <tr>
                <td><label for="profile">Profile</label></td>
                <td><textarea name="profile" id="profile" rows="20" cols="30" placeholder="Describe yourself"></textarea></td>
            </tr>
            <tr>
                <td><label for="createPW">Create password</label></td>
                <td><input type="password" name="createPW" id="createPW" placeholder="Create password" minlength="8" maxlength="12"></td>
            </tr>
            <tr>
                <td><label for="confirmPW">Confirm password</label></td>
                <td><input type="password" name="confirmPW" id="confirmPW" placeholder="Confirm password" minlength="8" maxlength="12"></td>
            </tr>
            <tr>
                <td>Expected salary</td>
                <td><input type="range" min="1000" max="10000"></td>
            </tr>
            <tr>
                <td></td>
                <td><button>Submit</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
